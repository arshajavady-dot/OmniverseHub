<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viper Drift — Cyber Snake Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt-overlay"></div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-box">
        <span class="hud-label">DATA CORES</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">VIPER LENGTH</span>
        <span id="length" class="hud-value">5</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">BOOST</span>
        <div class="boost-bar-bg"><div id="boost-bar" class="boost-bar-fill"></div></div>
      </div>
    </div>

    <div id="overlay" class="overlay">
      <div class="card">
        <h1 class="title">VIPER <span class="neon-green">DRIFT</span></h1>
        <p class="subtitle">CYBER SNAKE ARENA</p>

        <div id="game-over-info" class="hidden">
          <p class="game-over-text">SYSTEM OVERLOAD!</p>
          <p class="final-score">Cores Collected: <span id="final-score-val">0</span></p>
        </div>

        <div class="controls-guide">
          <p>🐍 <b>WASD</b> or <b>← ↑ ↓ →</b> : Drift Viper</p>
          <p>🔥 <b>Shift / Space</b> : Nitro Boost</p>
          <p>⚡ Collect Data Cores & Survive the Laser Perimeter!</p>
        </div>

        <button id="start-btn" class="btn">INITIALIZE ARENA</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
