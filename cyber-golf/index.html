<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Golf: Neon Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #030712;
      color: #e2e8f0;
      overflow: hidden;
      user-select: none;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    canvas {
      box-shadow: 0 0 35px rgba(234, 179, 8, 0.25), 0 0 70px rgba(6, 182, 212, 0.15);
      border: 2px solid rgba(234, 179, 8, 0.4);
      background: radial-gradient(circle at 50% 50%, #0d1326 0%, #030712 100%);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 bg-[#020617]">
  <div class="flex flex-col items-center max-w-2xl w-full">
    
    <!-- Top Header HUD -->
    <div class="flex items-center justify-between w-full max-w-[600px] bg-slate-900/90 border border-yellow-500/30 rounded-t-xl px-4 py-2 backdrop-blur-md">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⛳</span>
        <div>
          <h1 class="font-orbitron font-bold text-sm tracking-wider bg-gradient-to-r from-yellow-400 via-amber-300 to-cyan-400 bg-clip-text text-transparent">CYBER GOLF</h1>
          <p class="text-[10px] text-yellow-400/70">NEON MINI-GOLF LINKS</p>
        </div>
      </div>

      <div class="flex items-center gap-4 text-xs font-orbitron">
        <div class="text-right">
          <p class="text-[10px] text-slate-400">HOLE</p>
          <p id="hud-hole" class="font-bold text-yellow-400">1 / 5</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-400">STROKES</p>
          <p id="hud-strokes" class="font-bold text-cyan-300">0</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-400">PAR</p>
          <p id="hud-par" class="font-bold text-emerald-400">3</p>
        </div>
      </div>
    </div>

    <!-- Main Canvas Viewport -->
    <div class="relative w-full max-w-[600px]">
      <canvas id="gameCanvas" width="600" height="420" class="w-full h-auto border-b-0 cursor-crosshair"></canvas>

      <!-- Start / Game Over Overlay -->
      <div id="start-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
        <div class="text-6xl mb-2 animate-bounce">⛳🏌️‍♂️⚡</div>
        <h2 class="font-orbitron font-black text-3xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-cyan-400 mb-2">CYBER GOLF</h2>
        <p class="text-xs text-slate-300 max-w-xs mb-4">Chiptune Arcade Mini-Golf! Drag & release to aim your plasma ball, bounce off neon cushions, teleport through portal warps & score hole-in-ones.</p>

        <button id="btn-start" class="font-orbitron font-bold px-8 py-3 bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 text-slate-950 rounded-lg shadow-lg shadow-yellow-500/30 tracking-widest text-sm transition-all transform hover:scale-105 active:scale-95">
          TEE OFF
        </button>
      </div>
    </div>

    <!-- Bottom Status Bar -->
    <div class="flex items-center justify-between w-full max-w-[600px] bg-slate-900/90 border border-yellow-500/30 rounded-b-xl p-2.5 backdrop-blur-md text-xs font-mono">
      <span class="text-slate-300">CONTROLS: <span class="text-yellow-400 font-bold">CLICK & DRAG BALL TO AIM & PUTT</span></span>
      <button id="btn-reset-hole" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 font-orbitron text-[11px]">RESET HOLE</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
