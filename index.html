<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniVerse Hub — All-in-One Cyberpunk Arcade</title>
  <meta http-equiv="refresh" content="0; url=./omniverse-hub/index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #02040a;
      color: #f8fafc;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .container {
      max-width: 600px;
      padding: 40px 20px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
      backdrop-filter: blur(12px);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      color: #00f3ff;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: white;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.7);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 243, 255, 0.2);
      border-top-color: #00f3ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>OMNIVERSE HUB</h1>
    <p>Entering the Cyberpunk Arcade & Project Suite...</p>
    <a href="./omniverse-hub/index.html" class="btn"><span>▶</span> LAUNCH OMNIVERSE</a>
  </div>
  <script>
    window.location.href = "./omniverse-hub/index.html";
  </script>
</body>
</html>
