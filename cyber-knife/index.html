<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Knife: Neon Kunai Hit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt-overlay"></div>

  <div id="game-container">
    <header class="hud-bar">
      <div class="hud-pill">
        <span class="hud-label">SCORE</span>
        <span id="score-val" class="hud-val text-amber">0</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">STAGE</span>
        <span id="stage-val" class="hud-val text-pink">1</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">KUNAI LEFT</span>
        <span id="knives-val" class="hud-val text-cyan">7</span>
      </div>
      <button id="btn-sound" class="sound-pill-btn"><span>🔊</span></button>
    </header>

    <div class="canvas-wrapper">
      <div class="canvas-bezel">
        <canvas id="gameCanvas" width="460" height="520"></canvas>
      </div>
    </div>

    <!-- TOUCH THROW CONTROLS -->
    <div class="controls-bar">
      <button id="btn-throw-knife" class="throw-btn">
        <span>🗡️</span> THROW PLASMA KUNAI (SPACE / CLICK)
      </button>
    </div>

    <p class="instructions-footer">Tap / Click / Press <b>Spacebar</b> to throw your plasma kunai into the rotating cyber core. Do not hit existing knives!</p>

    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-icon">🗡️💥</div>
        <h2 class="modal-title">BLADE DEFLECTED</h2>
        <p class="modal-desc">Your plasma kunai struck another blade on the rotating core.</p>
        <div class="modal-stat-box">
          <p>FINAL SCORE: <span id="modal-final-score" class="text-amber">0</span></p>
        </div>
        <button id="modal-btn-restart" class="modal-btn">RELOAD KUNAI & REPLAY</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
