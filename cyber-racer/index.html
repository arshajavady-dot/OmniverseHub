<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Racer: Synthwave Outrun</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #030712;
      color: #e2e8f0;
      overflow: hidden;
      user-select: none;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    canvas {
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.25), 0 0 70px rgba(6, 182, 212, 0.15);
      border: 2px solid rgba(236, 72, 153, 0.4);
      background-color: #050714;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 bg-[#020617]">
  <div class="flex flex-col items-center max-w-2xl w-full">
    
    <!-- Top Header HUD -->
    <div class="flex items-center justify-between w-full max-w-[650px] bg-slate-900/90 border border-pink-500/30 rounded-t-xl px-4 py-2 backdrop-blur-md">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏎️</span>
        <div>
          <h1 class="font-orbitron font-bold text-sm tracking-wider bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 bg-clip-text text-transparent">CYBER RACER</h1>
          <p class="text-[10px] text-pink-400/70">SYNTHWAVE NEON HIGHWAY</p>
        </div>
      </div>

      <div class="flex items-center gap-5 text-xs font-orbitron">
        <div class="text-right">
          <p class="text-[10px] text-slate-400">SPEED</p>
          <p id="hud-speed" class="font-bold text-cyan-400">0 KM/H</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-400">SCORE</p>
          <p id="hud-score" class="font-bold text-pink-400">0</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-400">HIGH SCORE</p>
          <p id="hud-high" class="font-bold text-yellow-400">0</p>
        </div>
      </div>
    </div>

    <!-- Main Canvas Viewport -->
    <div class="relative w-full max-w-[650px]">
      <canvas id="gameCanvas" width="650" height="420" class="w-full h-auto border-b-0"></canvas>

      <!-- Game Over Overlay (Hidden by Default) -->
      <div id="start-overlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
        <div class="text-6xl mb-2 animate-bounce">🏎️💥⚡</div>
        <h2 id="overlay-title" class="font-orbitron font-black text-3xl tracking-wider text-pink-500 mb-2">HIGHWAY CRASH!</h2>
        <p id="overlay-desc" class="text-xs text-slate-300 max-w-xs mb-4">Final Score: <span id="final-score" class="text-cyan-400 font-bold font-orbitron">0</span></p>

        <button id="btn-start" class="font-orbitron font-bold px-8 py-3 bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-400 text-slate-950 rounded-lg shadow-lg shadow-pink-500/30 text-sm">
          RESTART NEON RUN
        </button>
      </div>
    </div>

    <!-- Bottom Status Bar & Action Controls -->
    <div class="flex flex-col w-full max-w-[650px] bg-slate-900/90 border border-pink-500/30 rounded-b-xl p-2 gap-2 backdrop-blur-md">
      <div class="flex items-center justify-between gap-2 text-xs font-orbitron">
        <button id="btn-left" class="flex-1 py-2 bg-pink-500/20 hover:bg-pink-500/30 border border-pink-500/40 rounded text-pink-300 font-bold text-center">
          ◀ STEER LEFT (A / ◀)
        </button>
        <button id="btn-accel" class="flex-1 py-2 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 rounded text-emerald-300 font-bold text-center">
          ⚡ ACCELERATE (W / ▲)
        </button>
        <button id="btn-right" class="flex-1 py-2 bg-pink-500/20 hover:bg-pink-500/30 border border-pink-500/40 rounded text-pink-300 font-bold text-center">
          STEER RIGHT (D / ▶)
        </button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
