<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Galaga: Neon Swarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-cyan-400 min-h-screen flex flex-col items-center justify-center p-2 select-none overflow-hidden font-mono">
  <!-- Scanlines & Ambient Starfield Background -->
  <div class="stars-container absolute inset-0 pointer-events-none z-0"></div>
  <div class="scanlines absolute inset-0 pointer-events-none z-10"></div>

  <!-- Header HUD -->
  <header class="relative z-20 w-full max-w-[500px] flex justify-between items-center bg-slate-900/90 border border-cyan-500/40 rounded-t-xl px-4 py-2 backdrop-blur shadow-[0_0_15px_rgba(6,182,212,0.2)]">
    <div class="flex items-center gap-2">
      <span class="text-xl">🚀</span>
      <div>
        <h1 class="font-black text-sm tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-yellow-400 to-pink-500 font-['Orbitron']">CYBER GALAGA</h1>
        <p class="text-[9px] text-slate-400">NEON SWARM BATTLE</p>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs font-['Orbitron']">
      <div>SCORE: <span id="hud-score" class="text-yellow-300 font-bold">00000</span></div>
      <div>STAGE: <span id="hud-stage" class="text-pink-400 font-bold">1</span></div>
      <div id="hud-lives" class="flex gap-1 text-sm">🚀🚀🚀</div>
    </div>
  </header>

  <!-- Main Game Canvas Container -->
  <div class="relative z-20 w-full max-w-[500px] bg-slate-950 border-x border-cyan-500/40 shadow-2xl flex justify-center items-center">
    <canvas id="gameCanvas" class="block w-full aspect-[3/4] max-h-[600px] bg-[#020208]"></canvas>

    <!-- Overlay Screen (Start / Game Over / Victory) -->
    <div id="overlay-screen" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 text-center backdrop-blur-sm z-30">
      <div class="text-4xl mb-2 animate-bounce">👾</div>
      <h2 id="overlay-title" class="text-2xl font-black font-['Orbitron'] text-cyan-300 tracking-widest mb-2 glow-cyan">CYBER GALAGA</h2>
      <p id="overlay-desc" class="text-xs text-slate-300 mb-6 max-w-[320px] leading-relaxed">
        Dodge dive-bombing insect formations, destroy Boss Galagas, and unlock <span class="text-yellow-400 font-bold">DUAL FIGHTER</span> mode with 2x plasma cannons!
      </p>

      <button id="btn-start" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black font-['Orbitron'] tracking-widest text-sm rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.6)] transition-all transform hover:scale-105 active:scale-95 cursor-pointer">
        LAUNCH FIGHTER
      </button>

      <div class="mt-6 flex flex-wrap justify-center gap-2 text-[10px] text-slate-400">
        <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700">◀ ▶ / A D : Move</span>
        <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700">SPACE : Fire Laser</span>
        <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700">SHIFT : Rapid Fire</span>
      </div>
    </div>
  </div>

  <!-- Bottom Action Bar -->
  <footer class="relative z-20 w-full max-w-[500px] bg-slate-900/90 border border-cyan-500/40 rounded-b-xl px-4 py-2 flex justify-between items-center text-[11px] text-slate-400">
    <div id="fighter-status" class="text-emerald-400 font-bold font-['Orbitron']">SINGLE FIGHTER</div>
    <div class="flex gap-2">
      <button id="btn-audio-toggle" class="hover:text-cyan-300 transition">🔊 AUDIO: ON</button>
    </div>
  </footer>

  <script src="game.js"></script>
</body>
</html>
