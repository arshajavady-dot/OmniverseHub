<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Snake: Cyber Helix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt-overlay"></div>

  <div id="game-container">
    <header class="hud-bar">
      <div class="hud-pill">
        <span class="hud-label">SCORE</span>
        <span id="score-val" class="hud-val text-amber">0</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">HIGH</span>
        <span id="high-score-val" class="hud-val text-cyan">0</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">LENGTH</span>
        <span id="length-val" class="hud-val text-green">3</span>
      </div>
      <button id="btn-sound" class="sound-pill-btn"><span>🔊</span></button>
    </header>

    <div class="canvas-wrapper">
      <div class="canvas-bezel">
        <canvas id="gameCanvas" width="460" height="460"></canvas>
      </div>
    </div>

    <!-- TOUCH D-PAD -->
    <div class="controls-bar">
      <div class="dpad-box">
        <button class="dpad-btn" data-dir="up">▲ (W)</button>
        <div class="dpad-row">
          <button class="dpad-btn" data-dir="left">◀ (A)</button>
          <button class="dpad-btn" data-dir="down">▼ (S)</button>
          <button class="dpad-btn" data-dir="right">▶ (D)</button>
        </div>
      </div>
    </div>

    <p class="instructions-footer">Use <b>WASD / Arrow Keys / Touch D-Pad</b> to steer. Eat neon quantum cores (🟡) & multiplier stars (💎) without colliding!</p>

    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-icon">🐍💥</div>
        <h2 class="modal-title">GRID SHORT-CIRCUIT</h2>
        <p class="modal-desc">Your cyber snake collided with a barrier wall or its own tail.</p>
        <div class="modal-stat-box">
          <p>FINAL SCORE: <span id="modal-final-score" class="text-amber">0</span></p>
        </div>
        <button id="modal-btn-restart" class="modal-btn">RE-INITIALIZE SNAKE</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
