<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Life: 2D Sandbox Survival</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #030712;
      color: #e2e8f0;
      overflow: hidden;
      user-select: none;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    canvas {
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.25), 0 0 70px rgba(6, 182, 212, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.4);
      background-color: #0c1a30;
    }
    .hotbar-slot {
      transition: all 0.15s ease-in-out;
    }
    .hotbar-slot.active {
      border-color: #10b981 !important;
      background-color: rgba(16, 185, 129, 0.25) !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      transform: scale(1.08);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 bg-[#020617]">
  <div class="flex flex-col items-center max-w-4xl w-full">
    
    <!-- Top Header HUD -->
    <div class="flex items-center justify-between w-full max-w-[800px] bg-slate-900/90 border border-emerald-500/30 rounded-t-xl px-4 py-2 backdrop-blur-md">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌲</span>
        <div>
          <h1 class="font-orbitron font-bold text-sm tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">CYBER LIFE</h1>
          <p class="text-[10px] text-emerald-400/70">TERRARIA 2D SANDBOX SURVIVAL</p>
        </div>
      </div>

      <!-- Health & Day/Night Indicator -->
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-400">HP:</span>
          <div class="w-32 bg-slate-950 border border-red-500/40 h-3.5 rounded-full overflow-hidden p-0.5">
            <div id="hp-bar" class="bg-gradient-to-r from-red-500 to-pink-500 h-full w-[100%] rounded-full transition-all duration-200"></div>
          </div>
          <span id="hp-text" class="text-xs font-orbitron font-bold text-red-400">100/100</span>
        </div>

        <div class="flex items-center gap-2 text-xs font-orbitron">
          <span id="time-icon" class="text-lg">☀️</span>
          <span id="time-text" class="text-amber-300 font-bold">DAYTIME</span>
        </div>
      </div>
    </div>

    <!-- Main Canvas Viewport -->
    <div class="relative w-full max-w-[800px]">
      <canvas id="gameCanvas" width="800" height="500" class="w-full h-auto border-b-0 cursor-crosshair"></canvas>

      <!-- Game Over / Respawn Overlay (Hidden by Default) -->
      <div id="start-overlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
        <div class="text-6xl mb-2 animate-bounce">🌲⛏️🗡️</div>
        <h2 class="font-orbitron font-black text-3xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 mb-2">CYBER LIFE</h2>
        <p class="text-xs text-slate-300 max-w-md mb-4">Terraria-inspired 2D Sandbox! Mine neon ores, chop laser wood, craft shelters, and slay cyber slimes under a day/night synth sky.</p>

        <button id="btn-start" class="font-orbitron font-bold px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 rounded-lg shadow-lg shadow-emerald-500/30 tracking-widest text-sm transition-all transform hover:scale-105 active:scale-95">
          RESPAWN MATRIX
        </button>
      </div>
    </div>

    <!-- Inventory Hotbar Toolbar & On-Screen Control Buttons -->
    <div class="flex flex-col w-full max-w-[800px] bg-slate-900/90 border border-emerald-500/30 rounded-b-xl p-2 gap-2 backdrop-blur-md">
      <div id="hotbar" class="flex items-center gap-2 w-full justify-center">
        <!-- 6 Hotbar Slots populated by JS -->
      </div>

      <!-- Action Control Buttons Bar -->
      <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-800 text-[11px]">
        <div class="flex items-center gap-1.5 flex-1">
          <button id="btn-move-left" class="flex-1 py-2 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 rounded font-orbitron font-bold text-emerald-300 text-center">
            ◀ LEFT (A)
          </button>
          <button id="btn-move-right" class="flex-1 py-2 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 rounded font-orbitron font-bold text-emerald-300 text-center">
            RIGHT (D) ▶
          </button>
          <button id="btn-jump" class="flex-1 py-2 bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/40 rounded font-orbitron font-bold text-cyan-300 text-center">
            ▲ JUMP (W)
          </button>
        </div>
        <div class="text-[10px] text-slate-400 font-mono text-right hidden sm:block">
          <span>LEFT CLICK: Mine / Attack</span> | <span>RIGHT CLICK: Place Block</span>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
